# Compile and test on Linux + macOS + Windows. Desktop permissions are not granted on
# GitHub-hosted runners; doctor --screenshot=false still checks tool discovery.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o "bin/marble-peer${EXE}" ./cmd/marble-peer

      - name: Version
        run: ./bin/marble-peer${EXE} version

      - name: Status / doctor (no screenshot on CI)
        run: |
          "./bin/marble-peer${EXE}" status || true
          "./bin/marble-peer${EXE}" doctor --screenshot=false --request-perms=false

      # Informational: does GDI capture + SendInput work in the runner's session?
      # A hosted runner may have no interactive desktop, so this never fails the job.
      - name: Doctor with screenshot (Windows, informational)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: |
          "./bin/marble-peer${EXE}" doctor --request-perms=false
          go test -count=1 -v -run 'Screenshot|Probe|InputStruct|InputInjection' ./internal/desktop
          go test -count=1 -v -run 'TrayScript|TrayHelper' ./internal/tray
          go test -count=1 -v -run 'TryFlock|PidAlive' ./internal/config

  cross-build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Vet
        run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go vet ./...

      - name: Build
        run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./cmd/marble-peer
